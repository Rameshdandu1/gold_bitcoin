[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-ai-market-intelligence"
version = "0.1.0"
description = "Research-only Delta India gold/BTC market intelligence with GPT/Claude consensus"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "websockets>=14,<17",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "openai>=1.80,<3",
  "anthropic>=0.77,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
